<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0f1419;font-family:'Inter',system-ui,sans-serif;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none;}
#game-wrapper{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;}

/* ─── title screen ─── */
#splash {
  position:fixed; inset:0; z-index:100; isolation:isolate;
  display:flex; flex-direction:column; justify-content:center;
  padding:clamp(1.5rem,6vw,7rem);
  background:#101913; color:#fff4db; overflow-y:auto; touch-action:pan-y;
  transition:opacity .25s ease, visibility .25s;
}
#splash[inert] { opacity:0; visibility:hidden; pointer-events:none; }
.cover-art {
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  object-position:59% center; z-index:-2;
}
#splash::before {
  content:''; position:absolute; inset:0; z-index:-1;
  background:linear-gradient(90deg,rgba(10,17,13,.86),rgba(10,17,13,.38) 43%,transparent 73%),
    linear-gradient(0deg,rgba(10,17,13,.66),transparent 24%);
}
.title-content { width:min(100%,33rem); }
.title-location {
  color:#ffc47b; font-size:clamp(.64rem,1.15vw,.78rem);
  font-weight:700; letter-spacing:.16em; text-transform:uppercase;
}
#gameTitle {
  margin:.7rem 0 1.15rem; font:400 clamp(4.25rem,10vw,9rem)/.82 Georgia,serif;
  letter-spacing:-.075em; text-shadow:0 3px 30px #101913;
}
#gameTitle em { display:block; color:#ffc47b; font-weight:400; }
.title-description {
  max-width:22rem; color:#ecdfc8; line-height:1.55; font-size:clamp(.9rem,1.45vw,1.14rem);
}
.title-actions { display:flex; flex-wrap:wrap; gap:.65rem; margin:1.4rem 0 .95rem; }
.title-button, #tutBtn, #orientBack {
  border:1px solid #ffc47b; border-radius:7px;
  background:#ffc47b; color:#171c13;
  min-height:44px; padding:.66rem 1.05rem; font:700 .94rem/1.2 'Inter',system-ui,sans-serif; cursor:pointer;
}
.title-button:hover, #tutBtn:hover, #orientBack:hover { background:#ffdb9e; }
#playBtn { display:inline-flex; gap:1.9rem; align-items:center; }
#practiceBtn { background:#17251abf; color:#fff4db; border-color:#a5ac8a; }
#practiceBtn:hover { background:#2e3f2d; }
.player-details { width:min(100%,19rem); font-size:.84rem; color:#ecdfc8; }
.player-details summary {
  display:list-item; width:fit-content; cursor:pointer; padding:.42rem 0; font-weight:600;
}
.player-details summary:hover { color:#ffc47b; }
.player-details label { display:block; margin:.35rem 0 .4rem; color:#ecdfc8; }
#nameIn {
  width:100%; padding:.58rem .68rem; border:1px solid #a5ac8a; border-radius:6px;
  background:#121d15; color:#fff4db; font:inherit; font-size:1rem; user-select:text; touch-action:auto;
}
#nameIn::placeholder { color:#b6b4a2; }
#splash :focus-visible, #tutorial button:focus-visible, #orient :focus-visible {
  outline:2px solid #fff4db; outline-offset:4px;
}
.title-footer {
  position:absolute; inset:auto clamp(1.5rem,6vw,7rem) clamp(1rem,3vh,2rem);
  display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:.5rem 1rem;
  color:#e4d8bf; font-size:.78rem;
}
.title-footer strong { margin-left:.4rem; color:#fff4db; }
.title-footer a { color:#fff4db; text-underline-offset:.24em; }
.title-footer a:hover { color:#ffc47b; }

/* ─── orientation lock overlay ─── */
#orient{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  background:#101913;color:#ffc47b;text-align:center;padding:2rem;}
#orient.show{display:flex;}
.orient-inner{max-width:300px;}
.orient-inner h2{font:400 2rem/1.1 Georgia,serif;margin-bottom:.65rem;color:#fff4db;}
.orient-inner p{color:#e4d8bf;font-size:.9rem;line-height:1.5;margin-bottom:1.15rem;}

/* ─── fullscreen toggle ─── */
#fsBtn{position:fixed;top:8px;right:8px;z-index:50;background:rgba(0,0,0,.4);color:#fff;
  border:none;border-radius:6px;padding:6px 10px;font-size:.7rem;cursor:pointer;display:none;font-family:inherit;}
#fsBtn.show{display:block;}

/* ─── practice overlay ─── */
#tutorial {
  position:fixed; z-index:150; top:max(.7rem,env(safe-area-inset-top)); left:50%;
  transform:translateX(-50%); width:min(38rem,calc(100% - 4.5rem));
  pointer-events:none;
}
#tutorial[data-step="5"] { top:auto; bottom:max(.7rem,env(safe-area-inset-bottom)); }
.tut-card {
  display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:.9rem;
  padding:.65rem .85rem; border:1px solid #829270; border-radius:12px;
  background:#142017f5; color:#fff4db; text-align:left;
  box-shadow:0 5px 22px #0007;
}
.tut-visual {
  display:grid; place-items:center; width:3.4rem; height:3.4rem; border-radius:8px;
  background:#283829; border:1px solid #687d60;
}
.tut-art {
  width:2rem; height:2.667rem; background:url('assets/newt-crawl.png') left top/400% 200%;
}
#tutorial[data-step="2"] .tut-art { transform:rotate(-25deg); }
#tutorial[data-step="3"] .tut-art {
  width:2.9rem; height:1.359rem; background:url('assets/sedan-drive.png') left top/200% 200%;
}
#tutProgress {
  display:block; margin-bottom:.19rem; color:#ffc47b; font-size:.64rem; font-weight:700;
  letter-spacing:.11em; text-transform:uppercase;
}
#tutTitle { font:400 clamp(1.22rem,2.45vw,1.63rem)/1.1 Georgia,serif; }
#tutTitle:focus { outline:none; }
#tutText { margin-top:.23rem; color:#e4d8bf; font-size:clamp(.72rem,1.42vw,.88rem); line-height:1.35; }
#tutBtn {
  min-height:40px; pointer-events:auto; font-size:.81rem; white-space:nowrap;
  background:#26382a; border-color:#879779; color:#fff4db;
}
#tutBtn:hover { background:#38513a; }
#tutorial[data-step="5"] #tutBtn { background:#ffc47b; border-color:#ffc47b; color:#171c13; }
#tutorial[data-step="5"] #tutBtn:hover { background:#ffdb9e; }

@media (orientation:portrait) {
  #splash { justify-content:flex-start; padding-top:clamp(11rem,44svh,28rem); }
  .cover-art { height:60%; object-position:86% center; }
  #splash::before {
    background:linear-gradient(0deg,#101913 37%,rgba(16,25,19,.84) 48%,transparent 72%);
  }
  #gameTitle { font-size:clamp(3.3rem,13vw,6.2rem); margin:.55rem 0 .75rem; }
  #gameTitle em { display:inline; }
  .title-actions { margin:1rem 0 .55rem; }
  .title-footer { position:static; margin-top:auto; padding-top:1.2rem; }
}
@media (max-height:550px) and (orientation:landscape) {
  #splash { padding:1.1rem 5vw 2.15rem; }
  #gameTitle { font-size:clamp(3.4rem,8.6vw,5.75rem); margin:.5rem 0 .65rem; }
  .title-description { max-width:19rem; font-size:.88rem; }
  .title-actions { margin:.8rem 0 .4rem; }
  .title-footer { inset:auto 5vw .65rem; }
  .tut-card { gap:.6rem; padding:.45rem .65rem; }
  .tut-visual { width:2.75rem; height:2.75rem; }
  .tut-art { scale:.83; }
}
@media (max-height:440px) and (orientation:landscape) {
  #splash:has(.player-details[open]) { justify-content:flex-start; }
  #splash:has(.player-details[open]) .title-footer { position:static; margin-top:.55rem; }
}
@media (max-height:370px) and (orientation:landscape) {
  #gameTitle { font-size:clamp(2.8rem,7vw,4.2rem); line-height:1; }
  #gameTitle em { display:inline; }
}
@media (prefers-reduced-motion:reduce) {
  #splash { transition:none; }
}
</style>

<body>

<div id="orient">
  <div class="orient-inner">
    <h2>Rotate to landscape</h2>
    <p>Turn your device sideways to see the whole crossing.</p>
    <button id="orientBack" type="button">Back to title</button>
  </div>
</div>

<aside id="tutorial" aria-label="Practice crossing" hidden>
  <div class="tut-card">
    <div class="tut-visual" aria-hidden="true"><div class="tut-art"></div></div>
    <div aria-live="polite" aria-atomic="true">
      <span id="tutProgress"></span>
      <h2 id="tutTitle" tabindex="-1"></h2>
      <p id="tutText"></p>
    </div>
    <button id="tutBtn" type="button">Skip practice</button>
  </div>
</aside>

<main id="splash" aria-labelledby="gameTitle">
  <img class="cover-art" src="assets/title-screen.webp" alt="" fetchpriority="high">
  <div class="title-content">
    <p class="title-location">Alma Bridge Road, California</p>
    <h1 id="gameTitle">Newt <em>Crosser</em></h1>
    <p class="title-description">Guide a California newt across a busy road to Lexington Reservoir.</p>
    <div class="title-actions">
      <button class="title-button" id="playBtn" type="button">Play <span aria-hidden="true">→</span></button>
      <button class="title-button" id="practiceBtn" type="button">How to play</button>
    </div>
    <details class="player-details">
      <summary>Set leaderboard name</summary>
      <label for="nameIn">Name on the leaderboard</label>
      <input id="nameIn" type="text" placeholder="Your name" maxlength="20" autocomplete="off">
    </details>
  </div>
  <footer class="title-footer">
    <p>Top score <strong id="hiScore">—</strong></p>
    <a href="http://bioblitz.club/newts" target="_blank" rel="noopener">About the real newt crossing ↗</a>
  </footer>
</main>

<button id="fsBtn" type="button" aria-label="Toggle fullscreen">⛶</button>
<div id="game-wrapper"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   GLOBALS
   ═══════════════════════════════════════════════════════════════ */
const _supabase = window.supabase;
const supabaseUrl = 'https://ovwktjjeoowlktdfbuuu.supabase.co';
const supabaseKey = 'sb_publishable_B2pz5WTA3UEVUeKACIgmBw_8_r0S3kU';
const supabaseClient = _supabase?.createClient(supabaseUrl, supabaseKey);

let playerName='', leaderboardEntries=[], globalHigh=0, topScore=0, topScoreName='';
let audioCtx=null, muted=false;


/* ─── leaderboard ─── */
function readLocalScores(){
  try{
    return JSON.parse(localStorage.getItem('newtLocalScores')||'[]')
      .filter(entry=>entry&&typeof entry.name==='string'&&Number.isSafeInteger(entry.score)&&entry.score>0);
  }catch{ return []; }
}

async function fetchLB(){
  if(!supabaseClient){
    const scores=readLocalScores();
    leaderboardEntries=scores.sort((a,b)=>b.score-a.score).slice(0,5);
    topScore=leaderboardEntries[0]?.score||0;
    topScoreName=leaderboardEntries[0]?.name||'';
    globalHigh=scores.find(entry=>entry.name.toLowerCase()===playerName.trim().toLowerCase())?.score||0;
    document.getElementById('hiScore').textContent=topScore?topScore+' · '+topScoreName:'—';
    return;
  }
  try{
    const { data, error } = await supabaseClient
      .from('alma_bridge_newt_crosser_scores')
      .select('name, score')
      .order('score', { ascending: false })
      .limit(5);
      
    if (error) throw error;
    
    leaderboardEntries = data || [];
    if(leaderboardEntries[0]){
      topScore=leaderboardEntries[0].score||0;
      topScoreName=leaderboardEntries[0].name||'';
    }
    
    if(playerName){
      const { data: myData, error: myError } = await supabaseClient
        .from('alma_bridge_newt_crosser_scores')
        .select('score')
        .eq('name', playerName)
        .order('score', { ascending: false })
        .limit(1);
        
      if (!myError && myData && myData.length > 0) {
        globalHigh = myData[0].score;
      }
    }
    const el=document.getElementById('hiScore');
    if(el) el.textContent=topScore?(topScore+(topScoreName?' · '+topScoreName:'')):'—';
  }catch(e){ console.error("Leaderboard fetch error:", e); }
}

async function submitScore(s){
  if(!playerName||s<=0) return;
  if(!supabaseClient){
    const scores=readLocalScores(), name=playerName.trim();
    const previous=scores.find(entry=>entry.name.toLowerCase()===name.toLowerCase());
    if(previous) previous.score=Math.max(previous.score,s);
    else scores.push({name,score:s});
    localStorage.setItem('newtLocalScores',JSON.stringify(scores));
    await fetchLB();
    return;
  }
  try{
    const { data, error } = await supabaseClient
      .rpc('submit_alma_bridge_newt_crosser_score', {
        player_name: playerName,
        player_score: s
      });
    if (error) throw error;
    globalHigh = Math.max(globalHigh, Number(data) || s);
    await fetchLB();
  }catch(e){ console.error("Score submit error:", e); }
}

/* ─── audio ─── */
function ensureAudio(){if(!audioCtx&&!muted)try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function resumeAudio(){if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});}
function sfx(type){
  if(muted) return; ensureAudio(); if(!audioCtx) return; resumeAudio();
  try{
    const n=audioCtx.currentTime, o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    if(type==='cross'){o.frequency.value=720; o.type='sine';}
    else if(type==='hit'){o.frequency.value=80;  o.type='sawtooth';}
    else if(type==='level'){o.frequency.value=520; o.type='triangle';}
    g.gain.setValueAtTime(.001,n);
    g.gain.exponentialRampToValueAtTime(.12,n+.01);
    g.gain.exponentialRampToValueAtTime(.0001,n+.25);
    o.start(n); o.stop(n+.3);
    o.onended=()=>{o.disconnect(); g.disconnect();};
  }catch(e){audioCtx=null;}
}
function vibrate(p){if(navigator.vibrate&&!muted) try{navigator.vibrate(p);}catch(e){}}

/* ─── fullscreen ─── */
function goFullscreen(){
  const el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;
  if(req) try{ req.call(el).catch(()=>{}); }catch(e){}
  if(screen.orientation&&screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
}
function isFullscreen(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}

/* ─── title and practice ─── */
const splash=document.getElementById('splash');
const nameIn=document.getElementById('nameIn');
const playBtn=document.getElementById('playBtn');
const fsBtn=document.getElementById('fsBtn');
const orient=document.getElementById('orient');
const tutorial=document.getElementById('tutorial');
const tutBtn=document.getElementById('tutBtn');
let practiceRequested=false, launchPending=false;

const lessonPrompts = [
  ['Move forward', 'Swipe up or press ↑ to take a step toward the road.'],
  ['Steer left and right', 'Swipe sideways or press ← or → to move along the shoulder.'],
  ['Wait for a gap', 'Watch the car. When your lane is clear, move toward the water.'],
  ['Reach the reservoir', 'Keep moving up until your newt reaches the shore.'],
  ['Crossing complete', 'Your newt made it to Lexington Reservoir.'],
];

function showTutorialStep(step, [title, text] = lessonPrompts[step-1]){
  tutorial.dataset.step=step;
  document.getElementById('tutProgress').textContent=step===5?'Practice complete':`Practice · ${step} of 4`;
  document.getElementById('tutTitle').textContent=title;
  document.getElementById('tutText').textContent=text;
  tutBtn.textContent=step===5?'Start game':'Skip practice';
}

function isMobile(){
  return window.matchMedia('(max-width:1024px)').matches&&navigator.maxTouchPoints>0;
}
function checkOrient(){
  const needsLandscape=splash.inert&&isMobile()&&innerHeight>innerWidth;
  orient.classList.toggle('show',needsLandscape);
  if(needsLandscape||!splash.inert) return;
  if(launchPending){
    launchPending=false;
    startSelectedMode();
  } else {
    window._game?.scale.refresh();
  }
}
window.addEventListener('resize',checkOrient);
window.addEventListener('orientationchange',()=>setTimeout(checkOrient,150));

function startSelectedMode(){
  fsBtn.classList.add('show');
  tutorial.hidden=true;
  if(window._game) window._game.scene.getScene('Game').scene.restart();
  else launchGame();
  if(!practiceRequested) gtag('event','start_game',{event_category:'Game'});
}

function openTitle(){
  launchPending=false;
  splash.inert=false;
  tutorial.hidden=true;
  fsBtn.classList.remove('show');
  checkOrient();
  playBtn.focus();
  if(isFullscreen()) document.exitFullscreen?.().catch(()=>{});
}

function beginRun(practice){
  practiceRequested=practice;
  playerName=nameIn.value.trim();
  ensureAudio(); resumeAudio();
  splash.inert=true;
  launchPending=true;
  if(isMobile()) goFullscreen();
  checkOrient();
}

fetchLB();
nameIn.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();playBtn.click();}});
playBtn.addEventListener('click',()=>beginRun(false));
document.getElementById('practiceBtn').addEventListener('click',()=>beginRun(true));
document.getElementById('orientBack').addEventListener('click',openTitle);
tutBtn.addEventListener('click',()=>{
  practiceRequested=false;
  startSelectedMode();
});
fsBtn.addEventListener('click',()=>{ if(isFullscreen()) document.exitFullscreen?.(); else goFullscreen(); });

/* ═══════════════════════════════════════════════════════════════
   TEXTURE BUILDERS — minimal, top-down, realistic-ish
   ═══════════════════════════════════════════════════════════════ */

/* California newt (Taricha torosa): broad head, rough dark dorsum,
   and bright orange underside peeking along the flanks. */
function makeNewt(sc,key,w,h){
  const g=sc.make.graphics({add:false});
  const cx=w*.5;

  /* ground shadow */
  g.fillStyle(0x000000,.25);
  g.fillEllipse(cx,h*.92,w*.58,h*.07);

  /* tail */
  g.fillStyle(0x463521);
  g.fillEllipse(cx,h*.83,w*.18,h*.24);
  g.fillStyle(0x332514);
  g.fillEllipse(cx,h*.93,w*.1,h*.11);

  /* legs — splayed outward */
  g.fillStyle(0x332514);
  g.fillEllipse(w*.18,h*.38,w*.18,h*.08);
  g.fillEllipse(w*.82,h*.38,w*.18,h*.08);
  g.fillEllipse(w*.2 ,h*.67,w*.18,h*.08);
  g.fillEllipse(w*.8 ,h*.67,w*.18,h*.08);
  g.fillStyle(0x24190d);
  [[w*.11,h*.38],[w*.14,h*.41],[w*.17,h*.4],[w*.83,h*.4],[w*.86,h*.41],[w*.89,h*.38],
    [w*.12,h*.68],[w*.15,h*.71],[w*.18,h*.7],[w*.82,h*.7],[w*.85,h*.71],[w*.88,h*.68]].forEach(([x,y])=>{
    g.fillCircle(x,y,w*.015);
  });

  /* body — dark olive-brown */
  g.fillStyle(0x3a301d);
  g.fillEllipse(cx,h*.54,w*.64,h*.56);

  /* flanks show orange underside */
  g.fillStyle(0xdf6b1f,.92);
  g.fillEllipse(w*.22,h*.54,w*.08,h*.33);
  g.fillEllipse(w*.78,h*.54,w*.08,h*.33);

  /* rough dorsal texture and faint mottling */
  g.fillStyle(0x4a3b24,.65);
  g.fillEllipse(cx,h*.5,w*.46,h*.34);
  g.fillStyle(0x54452b,.55);
  [[w*.4,h*.43,w*.018],[w*.56,h*.45,w*.02],[w*.46,h*.54,w*.017],[w*.62,h*.57,w*.015],[w*.35,h*.56,w*.014]].forEach(([x,y,r])=>{
    g.fillCircle(x,y,r*w);
  });

  /* darker dorsal centerline */
  g.fillStyle(0x20160c,.5);
  g.fillEllipse(cx,h*.54,w*.08,h*.46);

  /* head — broad and blunt */
  g.fillStyle(0x3a301d);
  g.fillEllipse(cx,h*.2,w*.48,h*.28);
  g.fillStyle(0x4b3d27,.45);
  g.fillEllipse(cx,h*.19,w*.3,h*.12);

  /* tiny eyes */
  g.fillStyle(0x000000);
  g.fillCircle(w*.39,h*.16,w*.035);
  g.fillCircle(w*.61,h*.16,w*.035);
  g.fillStyle(0xffffff,.7);
  g.fillCircle(w*.385,h*.154,w*.012);
  g.fillCircle(w*.605,h*.154,w*.012);

  g.generateTexture(key,w,h); g.destroy();
}

/* splat — minimal stain */
function makeSplat(sc,key,r){
  const s=r*2.4, g=sc.make.graphics({add:false});
  g.fillStyle(0x4a2a14,.7);
  g.fillEllipse(s*.5,s*.5,r*1.6,r*1.1);
  g.fillStyle(0x2a1808,.6);
  g.fillEllipse(s*.5,s*.5,r,r*.7);
  g.generateTexture(key,s,s); g.destroy();
}

/* ─── color helpers ─── */
function darken(hex,a){
  const c=Phaser.Display.Color.HexStringToColor(hex);
  return Phaser.Display.Color.GetColor(Math.max(0,c.r*(1-a)|0),Math.max(0,c.g*(1-a)|0),Math.max(0,c.b*(1-a)|0));
}
function lighten(hex,a){
  const c=Phaser.Display.Color.HexStringToColor(hex);
  return Phaser.Display.Color.GetColor(
    Math.min(255,c.r+(255-c.r)*a|0),
    Math.min(255,c.g+(255-c.g)*a|0),
    Math.min(255,c.b+(255-c.b)*a|0));
}
function hexNum(h){return parseInt(h.replace('#',''),16);}

/* realistic muted vehicle colors */
const VEHICLE_COLORS=['#2c3e50','#7f8c8d','#34495e','#922b21','#1f4e79','#1e6b3e','#5d4037','#222222','#bdc3c7'];

/* === SEDAN — top-down view, vehicle pointing LEFT (flipped if dir>0) === */
function makeSedan(sc,key,w,h,col){
  const g=sc.make.graphics({add:false}), cn=hexNum(col);
  /* shadow */
  g.fillStyle(0x000000,.28);
  g.fillRoundedRect(w*.04,h*.1,w*.92,h*.86,h*.18);
  /* body */
  g.fillStyle(cn);
  g.fillRoundedRect(w*.06,h*.06,w*.88,h*.88,h*.18);
  /* bumpers */
  g.fillStyle(darken(col,.38));
  g.fillRoundedRect(w*.06,h*.06,w*.08,h*.88,h*.08);
  g.fillRoundedRect(w*.86,h*.06,w*.08,h*.88,h*.08);
  /* hood/trunk seams */
  g.fillStyle(darken(col,.3),.55);
  g.fillRect(w*.08,h*.3,w*.84,1.5);
  g.fillRect(w*.08,h*.7,w*.84,1.5);
  /* windows (front + rear) */
  g.fillStyle(0x1a2530,.85);
  g.fillRoundedRect(w*.12,h*.32,w*.76,h*.16,4);
  g.fillRoundedRect(w*.12,h*.52,w*.76,h*.16,4);
  /* roof */
  g.fillStyle(lighten(col,.06));
  g.fillRoundedRect(w*.14,h*.34,w*.72,h*.32,h*.06);
  /* center pillars and door seams */
  g.fillStyle(0x0d1319,.45);
  g.fillRect(w*.48,h*.32,w*.03,h*.36);
  g.fillRect(w*.28,h*.22,w*.01,h*.56);
  g.fillRect(w*.72,h*.22,w*.01,h*.56);
  /* mirrors */
  g.fillStyle(darken(col,.22));
  g.fillRect(w*.04,h*.42,w*.04,h*.04);
  g.fillRect(w*.04,h*.54,w*.04,h*.04);
  g.fillRect(w*.92,h*.42,w*.04,h*.04);
  g.fillRect(w*.92,h*.54,w*.04,h*.04);
  /* headlights — front (left side) */
  g.fillStyle(0xfff4cc);
  g.fillRoundedRect(w*.07,h*.13,w*.06,h*.08,2);
  g.fillRoundedRect(w*.07,h*.79,w*.06,h*.08,2);
  /* taillights — rear */
  g.fillStyle(0xc0392b);
  g.fillRoundedRect(w*.87,h*.13,w*.06,h*.08,2);
  g.fillRoundedRect(w*.87,h*.79,w*.06,h*.08,2);
  /* highlight */
  g.fillStyle(0xffffff,.05);
  g.fillRoundedRect(w*.1,h*.08,w*.8,h*.04,2);
  g.generateTexture(key,w,h); g.destroy();
}

/* === SUV === */
function makeSUV(sc,key,w,h,col){
  const g=sc.make.graphics({add:false}), cn=hexNum(col);
  g.fillStyle(0x000000,.28);
  g.fillRoundedRect(w*.04,h*.1,w*.92,h*.86,h*.1);
  g.fillStyle(cn);
  g.fillRoundedRect(w*.05,h*.05,w*.9,h*.9,h*.1);
  g.fillStyle(darken(col,.38));
  g.fillRoundedRect(w*.05,h*.05,w*.08,h*.9,h*.06);
  g.fillRoundedRect(w*.87,h*.05,w*.08,h*.9,h*.06);
  /* tall roof / cabin */
  g.fillStyle(lighten(col,.06));
  g.fillRoundedRect(w*.1,h*.22,w*.8,h*.56,h*.05);
  /* windows */
  g.fillStyle(0x1a2530,.85);
  g.fillRoundedRect(w*.13,h*.25,w*.74,h*.13,3);
  g.fillRoundedRect(w*.13,h*.62,w*.74,h*.13,3);
  g.fillStyle(0x0d1319,.45);
  g.fillRect(w*.31,h*.23,w*.025,h*.54);
  g.fillRect(w*.49,h*.23,w*.025,h*.54);
  g.fillRect(w*.67,h*.23,w*.025,h*.54);
  /* mirrors */
  g.fillStyle(darken(col,.22));
  g.fillRect(w*.03,h*.38,w*.04,h*.05);
  g.fillRect(w*.03,h*.57,w*.04,h*.05);
  g.fillRect(w*.93,h*.38,w*.04,h*.05);
  g.fillRect(w*.93,h*.57,w*.04,h*.05);
  /* lights */
  g.fillStyle(0xfff4cc);
  g.fillRoundedRect(w*.06,h*.12,w*.06,h*.1,2);
  g.fillRoundedRect(w*.06,h*.78,w*.06,h*.1,2);
  g.fillStyle(0xc0392b);
  g.fillRoundedRect(w*.88,h*.12,w*.06,h*.1,2);
  g.fillRoundedRect(w*.88,h*.78,w*.06,h*.1,2);
  /* roof rails */
  g.fillStyle(darken(col,.32),.7);
  g.fillRect(w*.12,h*.2,w*.76,2);
  g.fillRect(w*.12,h*.78,w*.76,2);
  g.generateTexture(key,w,h); g.destroy();
}

/* === TRUCK / pickup === */
function makeTruck(sc,key,w,h,col){
  const g=sc.make.graphics({add:false}), cn=hexNum(col);
  g.fillStyle(0x000000,.28);
  g.fillRoundedRect(w*.03,h*.1,w*.94,h*.86,h*.08);
  /* cab (front) */
  g.fillStyle(cn);
  g.fillRoundedRect(w*.04,h*.06,w*.34,h*.88,h*.08);
  g.fillStyle(darken(col,.35));
  g.fillRoundedRect(w*.04,h*.06,w*.08,h*.88,h*.05);
  /* bed (rear) — different shade */
  g.fillStyle(darken(col,.22));
  g.fillRoundedRect(w*.36,h*.1,w*.6,h*.8,h*.04);
  /* bed rails */
  g.fillStyle(darken(col,.4));
  g.fillRect(w*.36,h*.1,w*.6,3);
  g.fillRect(w*.36,h*.87,w*.6,3);
  g.fillRect(w*.93,h*.1,3,h*.8);
  /* cab windows */
  g.fillStyle(0x1a2530,.85);
  g.fillRoundedRect(w*.08,h*.2,w*.26,h*.16,3);
  g.fillRoundedRect(w*.08,h*.64,w*.26,h*.16,3);
  g.fillStyle(0x0d1319,.45);
  g.fillRect(w*.2,h*.18,w*.02,h*.64);
  /* lights */
  g.fillStyle(0xfff4cc);
  g.fillRoundedRect(w*.05,h*.12,w*.05,h*.08,2);
  g.fillRoundedRect(w*.05,h*.8,w*.05,h*.08,2);
  g.fillStyle(0xc0392b);
  g.fillRoundedRect(w*.9,h*.12,w*.05,h*.08,2);
  g.fillRoundedRect(w*.9,h*.8,w*.05,h*.08,2);
  /* mirrors */
  g.fillStyle(darken(col,.28));
  g.fillRect(w*.02,h*.32,w*.04,h*.05);
  g.fillRect(w*.02,h*.63,w*.04,h*.05);
  g.generateTexture(key,w,h); g.destroy();
}

/* === MOTORCYCLE — narrow, fast === */
function makeMotorcycle(sc,key,w,h){
  const g=sc.make.graphics({add:false});
  /* shadow */
  g.fillStyle(0x000000,.25);
  g.fillEllipse(w*.5,h*.6,w*.85,h*.5);
  /* tires (front/rear stripes) */
  g.fillStyle(0x111);
  g.fillRoundedRect(w*.06,h*.34,w*.14,h*.32,3);
  g.fillRoundedRect(w*.8 ,h*.34,w*.14,h*.32,3);
  /* body / fairing */
  g.fillStyle(0x2c2c2c);
  g.fillRoundedRect(w*.22,h*.3,w*.56,h*.4,h*.15);
  g.fillStyle(0x50565c);
  g.fillRect(w*.28,h*.47,w*.44,h*.06);
  /* tank */
  g.fillStyle(0x444);
  g.fillRoundedRect(w*.42,h*.36,w*.16,h*.28,h*.08);
  /* helmet (rider top-down) */
  g.fillStyle(0x38424a);
  g.fillEllipse(w*.5,h*.5,w*.22,h*.3);
  g.fillStyle(0x171c20);
  g.fillEllipse(w*.5,h*.5,w*.14,h*.18);
  /* headlight */
  g.fillStyle(0xfff4cc);
  g.fillCircle(w*.09,h*.5,h*.06);
  /* taillight */
  g.fillStyle(0xc0392b);
  g.fillCircle(w*.91,h*.5,h*.05);
  g.generateTexture(key,w,h); g.destroy();
}

/* ═══════════════════════════════════════════════════════════════
   GAME SCENE
   ═══════════════════════════════════════════════════════════════ */
class GameScene extends Phaser.Scene {
  constructor(){ super('Game'); }

  preload(){
    this.load.spritesheet('newt_sheet', 'assets/newt-crawl.png', { frameWidth: 192, frameHeight: 256 });
    // The generated 1254px sheet has four equal cells per row.
    this.load.spritesheet('volunteer_sheet', 'assets/volunteer_sprite_sheet.png', { frameWidth: 313.5, frameHeight: 313.5 });
    this.load.spritesheet('volunteer_walk_sheet', 'assets/volunteer_walk.png', { frameWidth: 443.5, frameHeight: 443.5 });
    this.load.image('asphalt', 'assets/road-asphalt.webp');
    this.load.image('reservoir', 'assets/reservoir-shore.webp');
    this.load.image('forest', 'assets/forest-edge.webp');
    const trafficSheets = [
      ['sedan_img', 'assets/sedan-drive.png', 120],
      ['sedan_red', 'assets/sedan-red-drive.png', 102],
      ['hatchback_blue', 'assets/hatchback-blue-drive.png', 122],
      ['coupe_silver', 'assets/coupe-silver-drive.png', 130],
      ['suv_img', 'assets/suv-drive.png', 123],
      ['suv_black', 'assets/suv-black-drive.png', 128],
      ['truck_img', 'assets/truck-drive.png', 110],
      ['truck_yellow', 'assets/truck-yellow-drive.png', 126],
      ['truck_red', 'assets/truck-red-drive.png', 144],
      ['moto_img', 'assets/moto-drive.png', 110],
      ['moto_orange', 'assets/moto-orange-drive.png', 119],
      ['cyclist_img', 'assets/cyclist-drive.png', 103]
    ];
    trafficSheets.forEach(([key, file, frameHeight]) => {
      this.load.spritesheet(key, file, { frameWidth: 256, frameHeight });
    });
  }

  create(){
    const W=this.scale.width, H=this.scale.height;
    /* tile size — based on smaller dim so it works in any aspect ratio */
    const TS=Math.max(28,Math.min(W,H)/11);
    this.TS=TS;

    /* layout */
    this.ROAD_TOP   = H*.26;
    this.ROAD_BOT   = H*.74;
    this.ROAD_MID   = (this.ROAD_TOP+this.ROAD_BOT)/2;
    this.SHOULDER_H = TS*.7;
    this.SPAWN_Y    = H-TS*1.0;

    /* state */
    this.score=0;
    this.lives=3;
    this.isOver=false;
    this.isTutorial=practiceRequested;
    this.gameOverShown=false; this.canReplay=false;
    this.newtAlive=true; this.targetAng=0; this.lastStep=0;
    this.invulnerable=false;
    this.diff=1;

    /* textures */
    const nw=Math.round(TS*.95), nh=Math.round(TS*1.35);
    if(!this.textures.exists('splat')) makeSplat(this,'splat',Math.round(TS*.55));

    /* vehicle textures */
    this.vehPool=[];
    const vTypes=[
      {
        variants: [
          {key:'sedan_img', wm:2.5, hm:1.25},
          {key:'sedan_red', wm:2.5, hm:1.25},
          {key:'hatchback_blue', wm:2.3, hm:1.2},
          {key:'coupe_silver', wm:2.4, hm:1.15}
        ],
        spd: 1.0,
        weight: 10
      },
      {
        variants: [
          {key:'suv_img', wm:2.8, hm:1.45},
          {key:'suv_black', wm:3.0, hm:1.55}
        ],
        spd: 0.9,
        weight: 6
      },
      {
        variants: [
          {key:'truck_img', wm:3.5, hm:1.5},
          {key:'truck_yellow', wm:3.6, hm:1.6},
          {key:'truck_red', wm:3.8, hm:1.7}
        ],
        spd: 0.75,
        weight: 4
      },
      {
        variants: [
          {key:'moto_img', wm:1.6, hm:0.9},
          {key:'moto_orange', wm:1.6, hm:0.9}
        ],
        spd: 1.45,
        weight: 2
      },
      {
        variants: [
          {key:'cyclist_img', wm:1.7, hm:0.6}
        ],
        spd: 0.65,
        weight: 3
      }
    ];

    vTypes.forEach(vt=>{
      vt.variants.forEach(({key})=>{
        if(this.textures.exists(key)&&!this.anims.exists(key)){
          this.anims.create({
            key, frames:this.anims.generateFrameNumbers(key,{start:0,end:3}),
            frameRate:12, repeat:-1
          });
        }
      });
      for(let n=0;n<vt.weight;n++) {
        this.vehPool.push({
          variants: vt.variants,
          spdMul: vt.spd
        });
      }
    });

    /* Reservoir and forest art include the gravel shoulders. */
    const roadH=this.ROAD_BOT-this.ROAD_TOP;
    this.add.image(0,0,'reservoir').setOrigin(0).setDisplaySize(W,this.ROAD_TOP+1).setDepth(-10);
    this.add.image(0,this.ROAD_BOT-1,'forest').setOrigin(0).setDisplaySize(W,H-this.ROAD_BOT+1).setDepth(-10);
    this.add.tileSprite(0,this.ROAD_TOP,W,roadH,'asphalt')
      .setOrigin(0).setTileScale(TS/64).setDepth(-9);
    const markings=this.add.graphics().setDepth(-7);
    markings.lineStyle(Math.max(2,TS*.035),0xddd6ba,.72);
    markings.lineBetween(0,this.ROAD_TOP+TS*.1,W,this.ROAD_TOP+TS*.1);
    markings.lineBetween(0,this.ROAD_BOT-TS*.1,W,this.ROAD_BOT-TS*.1);

    const upperY = this.ROAD_TOP + (this.ROAD_MID - this.ROAD_TOP) * 0.55;
    const lowerY = this.ROAD_MID + (this.ROAD_BOT - this.ROAD_MID) * 0.45;
    const roadLabels = W > 800 ? [W * 0.25, W * 0.75] : [W * 0.5];
    roadLabels.forEach((x, idx) => {
      const y = idx % 2 === 0 ? upperY : lowerY;
      this.add.text(x, y, 'ALMA BRIDGE ROAD', {
        fontFamily: 'Inter',
        fontSize: Math.max(14, TS * 0.45) + 'px',
        fontStyle: '800',
        color: '#ffffff'
      }).setOrigin(0.5).setDepth(-8).setAlpha(0.08);
    });

    /* LEXINGTON RESERVOIR label */
    this.add.text(W/2,this.ROAD_TOP-this.SHOULDER_H-TS*.32,'LEXINGTON RESERVOIR',
      {fontFamily:'Inter',fontSize:Math.max(10,TS*.28)+'px',fontStyle:'700',color:'#c5ecf0',stroke:'#102e38',strokeThickness:3})
      .setOrigin(.5).setDepth(-3);

    /* ── lanes — adapt to road height ── */
    /* keep lanes tall enough that vehicles in adjacent lanes never overlap vertically */
    const laneCount=Math.max(2,Math.floor(roadH/(TS*1.8)));
    this.lanes=[];
    const laneH=roadH/laneCount;
    for(let i=0;i<laneCount;i++){
      this.lanes.push({
        y:this.ROAD_TOP+laneH*(i+.5),
        dir:i%2===0?-1:1
      });
    }
    markings.lineStyle(Math.max(2,TS*.045),0xe7bb56,.76);
    for(let i=1;i<laneCount;i++){
      const y=this.ROAD_TOP+i*laneH;
      for(let x=0;x<W;x+=TS*1.4) markings.lineBetween(x,y,x+TS*.7,y);
    }

    /* vehicles */
    this.vehicles=this.physics.add.group();
    this.spawnCars();

    /* player newt */
    if(!this.anims.exists('crawl')){
      this.anims.create({
        key: 'crawl',
        frames: this.anims.generateFrameNumbers('newt_sheet', { start: 0, end: 7 }),
        frameRate: 20,
        repeat: 0
      });
    }

    this.newt=this.physics.add.sprite(W/2,this.SPAWN_Y,'newt_sheet').setDepth(5);
    this.newt.on('animationcomplete', () => this.newt.setFrame(0));
    this.newt.setDisplaySize(nw, nh);
    this.newt.body.setAllowGravity(false);
    this.newt.setCollideWorldBounds(true);
    // Body size should be relative to the display size for better accuracy
    this.newt.body.setSize(this.newt.width*0.4, this.newt.height*0.4);

    /* cleanup worker */
    if(!this.anims.exists('volunteer_walk')){
      this.anims.create({
        key:'volunteer_walk',
        frames:this.anims.generateFrameNumbers('volunteer_walk_sheet',{start:0,end:7}),
        frameRate:12, repeat:-1
      });
      this.anims.create({
        key:'volunteer_peel',
        frames:this.anims.generateFrameNumbers('volunteer_sheet',{start:8,end:15}),
        frameRate:6, repeat:0
      });
    }
    this.splats=[];
    this.cleanerSp=this.physics.add.sprite(-TS*2,this.ROAD_BOT+this.SHOULDER_H*.6,'volunteer_sheet')
      .setDisplaySize(TS*2,TS*2).setOrigin(.5,.96).setDepth(4).setVisible(false);
    // Both sheets use different resolutions but share the same size in the game.
    this.cleanerSp.on('animationstart',()=>this.cleanerSp.setDisplaySize(TS*2,TS*2));
    this.cleanerSp.body.setAllowGravity(false);
    this.cleanerSp.setImmovable(true);
    this.cleanerState='idle';
    this.cleanerTarget=null;

    /* HUD top bar */
    const fs=Math.max(13,TS*.4);
    const hudStyle={fontFamily:'Inter',fontSize:fs+'px',fontStyle:'600',color:'#fff'};
    this.add.rectangle(0,0,W,fs*1.9,0x000000,.45).setOrigin(0,0).setDepth(10);
    this.scoreTxt=this.add.text(TS*.4,fs*.5,'Score  0',hudStyle).setDepth(11);
    this.livesTxt=this.add.text(W-TS*.4,fs*.5,'',hudStyle).setOrigin(1,0).setDepth(11);
    this.bestTxt =this.add.text(W/2,fs*.5,'',{...hudStyle,color:'#e8a35c'}).setOrigin(.5,0).setDepth(11);
    this.updateHUD();

    /* mute button */
    const muteSize=Math.max(16,TS*.5);
    this.muteBt=this.add.text(TS*.4,fs*2.2,muted?'🔇':'🔊',
      {fontSize:muteSize+'px'}).setDepth(11).setInteractive({useHandCursor:true});
    this.muteBt.on('pointerdown',e=>{
      if(e&&e.event){e.event.stopPropagation();}
      muted=!muted; this.muteBt.setText(muted?'🔇':'🔊');
    });

    /* game over container */
    this.goContainer=this.add.container(0,0).setDepth(30).setVisible(false);

    /* input — keyboard */
    this.input.keyboard.on('keydown-UP',   ()=>this.step(0,-1));
    this.input.keyboard.on('keydown-DOWN', ()=>this.step(0, 1));
    this.input.keyboard.on('keydown-LEFT', ()=>this.step(-1,0));
    this.input.keyboard.on('keydown-RIGHT',()=>this.step( 1,0));
    this.input.keyboard.on('keydown-W',    ()=>this.step(0,-1));
    this.input.keyboard.on('keydown-S',    ()=>this.step(0, 1));
    this.input.keyboard.on('keydown-A',    ()=>this.step(-1,0));
    this.input.keyboard.on('keydown-D',    ()=>this.step( 1,0));
    this.input.keyboard.on('keydown-ENTER',()=>this.replayIfReady());

    /* input — touch / pointer */
    let sx=0,sy=0,st=0,muteHit=false;
    this.input.on('pointerdown',p=>{
      /* ignore taps on the mute button area */
      muteHit = p.x<TS*1.0 && p.y<TS*3.2 && p.y>fs*1.9;
      if(this.isOver) return;
      sx=p.x; sy=p.y; st=this.time.now;
    });
    this.input.on('pointerup',p=>{
      if(this.isOver||muteHit) return;
      const dx=p.x-sx, dy=p.y-sy, dist=Math.sqrt(dx*dx+dy*dy);
      const SWIPE=Math.max(15,this.TS*.35);
      if(dist>SWIPE){
        if(Math.abs(dx)>Math.abs(dy)) this.step(dx>0?1:-1,0);
        else this.step(0,dy>0?1:-1);
      } else if(this.time.now-st<350){
        if(!this.newtAlive) return;
        const ndx=p.x-this.newt.x, ndy=p.y-this.newt.y;
        if(Math.abs(ndx)>Math.abs(ndy)) this.step(ndx>0?1:-1,0);
        else this.step(0,ndy>0?1:-1);
      }
    });

    /* baseline difficulty drift */
    this.time.addEvent({delay:30000,loop:true,callback:()=>{
      if(!this.isOver && !this.isTutorial) this.diff=Math.min(3.5,this.diff+.08);
    }});

    if (this.isTutorial) {
      this.startTutorialMode();
    }
    window._game = this.game;
  }

  startTutorialMode() {
    this.isTutorial = true;
    this.tutorialStep = 1;

    showTutorialStep(1);
    tutorial.hidden=false;
    document.getElementById('tutTitle').focus();

    if (this.scoreTxt) this.scoreTxt.setVisible(false);
    if (this.livesTxt) this.livesTxt.setVisible(false);
    if (this.bestTxt) this.bestTxt.setVisible(false);
    if (this.muteBt) this.muteBt.setVisible(false);

    this.vehicles.clear(true, true);
    this.newt.setPosition(this.scale.width / 2, this.SPAWN_Y);
  }

  spawnTutorialCar() {
    this.vehicles.clear(true, true);
    const lane = this.lanes[Math.floor(this.lanes.length / 2)] || { y: this.scale.height * 0.5, dir: 1 };
    const x = this.newt.x - lane.dir * this.TS * 4;
    const v = this.createVehicle(x, lane, 'sedan_img', this.TS * 2.5);
    v.dir = lane.dir;
    v.baseSpd = (this.TS * 4) / (this.scale.width * .085);
    v.spd = v.baseSpd;
    v.wm = 2.5;
    v.hm = 1.25;
    v.isTutorialCar = true;
    this.vehicles.add(v);
  }

  onTutorialHit() {
    if(!this.newtAlive||this.invulnerable) return;
    sfx('hit'); vibrate([40,30,80]);
    this.cameras.main.shake(180,.012);
    this.cameras.main.flash(160,255,60,60);
    const sp=this.add.image(this.newt.x,this.newt.y,'splat').setDepth(1).setAlpha(.85);
    this.time.delayedCall(1500, () => sp.destroy());
    
    this.newtAlive=false;
    this.tweens.killTweensOf(this.newt);
    this.newt.stop().setFrame(0).setVisible(false);
    
    showTutorialStep(3, ['Try again', 'Pause at the edge of the road until the car passes.']);

    this.time.delayedCall(800, () => {
      this.newt.setPosition(this.scale.width / 2, this.SPAWN_Y).setVisible(true).setAlpha(1);
      this.newt.angle=0;
      this.targetAng=0;
      this.newtAlive=true;
      this.invulnerable=true;
      this.tweens.add({
        targets:this.newt, alpha:{from:.4,to:1}, duration:90, repeat:3, yoyo:true,
        onComplete:()=>{this.newt.setAlpha(1); this.invulnerable=false;}
      });
      this.spawnTutorialCar();
      showTutorialStep(3);
    });
  }

  onTutorialCross() {
    this.isTutorial = false;
    
    sfx('level'); vibrate(15);
    this.cameras.main.flash(80,90,180,90,true);
    
    showTutorialStep(5);

    this.newtAlive = false;
    this.tweens.killTweensOf(this.newt);
    
    this.tweens.add({
      targets: this.newt,
      scaleX: this.newt.scaleX * 1.3,
      scaleY: this.newt.scaleY * 1.3,
      duration: 300,
      yoyo: true,
      repeat: 2
    });
  }

  /* ── HUD update ── */
  updateHUD(){
    if(this.scoreTxt) this.scoreTxt.setText('Score  '+this.score);
    if(this.livesTxt) this.livesTxt.setText('♥ '.repeat(Math.max(0,this.lives)).trim());
    if(this.bestTxt)  this.bestTxt.setText(topScore?('Best  '+topScore):'');
  }

  replayIfReady(){
    if(this.isOver&&this.gameOverShown&&this.canReplay) this.scene.restart();
  }

  returnHomeIfReady(){
    if(!this.isOver||!this.gameOverShown||!this.canReplay) return;
    this.canReplay=false;
    this.scene.stop();
    openTitle();
    fetchLB();
  }

  /* ── movement ── */
  step(dx,dy){
    if(!this.newtAlive||this.isOver) return;
    if(this.isTutorial && ((this.tutorialStep===1 && dy>=0) || (this.tutorialStep===2 && !dx))) return;
    const now=this.time.now;
    if(now-this.lastStep<85) return;
    this.lastStep=now;
    const TS=this.TS, W=this.scale.width, H=this.scale.height;
    let nx=Phaser.Math.Clamp(this.newt.x+dx*TS,TS*.6,W-TS*.6);
    let ny=Phaser.Math.Clamp(this.newt.y+dy*TS,TS,H-TS*.6);
    if(dy>0&&ny>this.SPAWN_Y+TS*.3) ny=this.newt.y;
    if(dy<0) this.targetAng=0;
    else if(dy>0) this.targetAng=180;
    else if(dx<0) this.targetAng=-90;
    else if(dx>0) this.targetAng=90;
    if(nx!==this.newt.x||ny!==this.newt.y) this.newt.play('crawl',true);
    this.tweens.add({targets:this.newt,x:nx,y:ny,duration:80,ease:'Power2'});

    if (this.isTutorial) {
      if (this.tutorialStep === 1 && dy < 0) {
        this.tutorialStep = 2;
        showTutorialStep(2);
      } else if (this.tutorialStep === 2 && dx !== 0) {
        this.tutorialStep = 3;
        showTutorialStep(3);
        this.spawnTutorialCar();
      }
    }
  }

  /* ── spawn vehicles ── */
  createVehicle(x,lane,key,width){
    const v=this.physics.add.sprite(x,lane.y,key,0).setDepth(2);
    v.setScale(width/v.width).setFlipX(lane.dir>0);
    v.body.setSize(v.width*.9,v.height*.9);
    v.body.setAllowGravity(false);
    if(this.anims.exists(key)) v.play({key,randomFrame:true});
    return v;
  }

  spawnCars(){
    this.vehicles.clear(true,true);
    if(this.isTutorial) return;
    const W=this.scale.width, TS=this.TS;
    this.lanes.forEach(lane=>{
      const laneBaseSpd=.7+Math.random()*.4;
      const scoreScale=this.score||0;
      const count=Phaser.Math.Between(2 + Math.floor(scoreScale/5), 4 + Math.floor(scoreScale/3));
      /* keep enough space between cars (plus a little random) so they never overlap */
      const minGap=Math.max(TS*2.6, TS*5 - scoreScale*TS*0.12);
      let cursor=Phaser.Math.Between(0,Math.round(TS*2));
      for(let i=0;i<count;i++){
        const entry=Phaser.Utils.Array.GetRandom(this.vehPool);
        const variant=Phaser.Utils.Array.GetRandom(entry.variants);
        const sVar = 1 + (Math.random() * 0.1 - 0.05);
        const targetWidth = TS * variant.wm * sVar;
        const v=this.createVehicle(cursor,lane,variant.key,targetWidth);
        v.dir=lane.dir;
        v.baseSpd=laneBaseSpd*entry.spdMul;
        v.spd=v.baseSpd;
        v.wm=variant.wm;
        v.hm=variant.hm;
        v.sVar=sVar;
        this.vehicles.add(v);
        cursor += targetWidth + minGap + Phaser.Math.Between(0, Math.round(TS*1.6));
      }
    });
  }

  /* ── collision ── */
  onHit(){
    if(!this.newtAlive||this.invulnerable) return;
    sfx('hit'); vibrate([40,30,80]);
    this.cameras.main.shake(180,.012);
    this.cameras.main.flash(160,255,60,60);
    const sp=this.add.image(this.newt.x,this.newt.y,'splat').setDepth(1).setAlpha(.85);
    const stain={sprite:sp};
    this.splats.push(stain);
    if(this.cleanerState==='idle') this.activateCleaner(stain);
    this.newtAlive=false;
    this.tweens.killTweensOf(this.newt);
    this.newt.stop().setFrame(0).setVisible(false);
    this.lives--;
    this.updateHUD();
    if(this.lives<=0){
      this.isOver=true;
      this.vehicles.children.iterate(v=>v.anims.pause());
      submitScore(this.score);
      gtag('event','game_over',{event_category:'Game',value:this.score});
      this.time.delayedCall(450,()=>this.showGameOver());
    } else {
      this.time.delayedCall(500,()=>this.resetNewt());
    }
  }

  /* ── crossed ── */
  onCross(){
    this.score++;
    sfx('cross'); vibrate(15);
    this.cameras.main.flash(80,90,180,90,true);
    const ft=this.add.text(this.newt.x,this.newt.y,'+1',
      {fontFamily:'Inter',fontSize:this.TS*.6+'px',fontStyle:'700',color:'#5a8a4f'}).setOrigin(.5).setDepth(15);
    this.tweens.add({targets:ft,y:ft.y-this.TS*1.4,alpha:0,duration:600,ease:'Power2',onComplete:()=>ft.destroy()});

    /* difficulty scales with score */
    this.diff=1+this.score*0.09;
    if(this.score%2===0){ sfx('level'); this.spawnCars(); }
    this.updateHUD();
    this.resetNewt();
    gtag('event','newt_crossed',{event_category:'Game',value:this.score});
  }

  /* ── reset newt ── */
  resetNewt(){
    const W=this.scale.width;
    this.tweens.killTweensOf(this.newt);
    this.newt.stop().setFrame(0).setPosition(W/2,this.SPAWN_Y).setVisible(true).setAlpha(1);
    this.newt.angle=0; this.targetAng=0; this.newtAlive=true;
    this.invulnerable=true;
    this.tweens.add({
      targets:this.newt, alpha:{from:.4,to:1}, duration:90, repeat:5, yoyo:true,
      onComplete:()=>{this.newt.setAlpha(1); this.invulnerable=false;}
    });
  }

  activateCleaner(stain){
    if(!stain||!stain.sprite||!stain.sprite.active) return;
    this.cleanerTarget=stain;
    this.cleanerState='entering';
    const fromLeft=stain.sprite.x < this.scale.width/2;
    this.cleanerSp.setVisible(true).play('volunteer_walk');
    this.cleanerSp.x=fromLeft ? -this.TS*2 : this.scale.width+this.TS*2;
    this.cleanerSp.y=this.ROAD_BOT+this.SHOULDER_H*.7;
    this.cleanerSp.setFlipX(!fromLeft);
  }

  updateCleaner(time,dt){
    if(this.cleanerState==='idle') return;
    const worker=this.cleanerSp;
    const speed=this.TS*2.4*dt;
    if(this.cleanerState==='entering'){
      if(!this.cleanerTarget||!this.cleanerTarget.sprite||!this.cleanerTarget.sprite.active){
        this.cleanerState='exiting';
        return;
      }
      // Stand beside the stain so the scraper reaches it while kneeling.
      const tx=this.cleanerTarget.sprite.x+(worker.flipX?1:-1)*this.TS*.65;
      const ty=this.cleanerTarget.sprite.y;
      const dx=tx-worker.x, dy=ty-worker.y;
      if(Math.hypot(dx,dy)<Math.max(speed*3,this.TS*.35)){
        worker.setPosition(tx,ty).play('volunteer_peel');
        this.cleanerState='cleaning';
        return;
      }
      worker.x+=Math.sign(dx)*Math.min(Math.abs(dx),speed);
      worker.y+=Math.sign(dy)*Math.min(Math.abs(dy),speed*.75);
    } else if(this.cleanerState==='cleaning'){
      // Remove the road stain as the lifting pose raises the recovered newt.
      if(worker.frame.name>=13&&this.cleanerTarget?.sprite.active){
        this.cleanerTarget.sprite.destroy();
        this.splats=this.splats.filter(item=>item!==this.cleanerTarget&&item.sprite.active);
      }
      if(!worker.anims.isPlaying){
        this.cleanerTarget=null;
        this.cleanerState='exiting';
        worker.play('volunteer_walk');
      }
    } else if(this.cleanerState==='exiting'){
      const exitLeft=worker.x < this.scale.width/2;
      const tx=exitLeft ? -this.TS*2 : this.scale.width+this.TS*2;
      const ty=this.ROAD_BOT+this.SHOULDER_H*.7;
      const dx=tx-worker.x, dy=ty-worker.y;
      if(Math.hypot(dx,dy)<Math.max(speed*3,this.TS*.4)){
        worker.stop().setFrame(0).setVisible(false);
        this.cleanerState='idle';
        if(this.splats.length) this.activateCleaner(this.splats[0]);
        return;
      }
      worker.x+=Math.sign(dx)*Math.min(Math.abs(dx),speed);
      worker.y+=Math.sign(dy)*Math.min(Math.abs(dy),speed*.75);
      worker.setFlipX(dx<0);
    }
  }

  /* ── game over screen with leaderboard ── */
  showGameOver(){
    const W=this.scale.width,H=this.scale.height,TS=this.TS,c=this.goContainer;
    this.gameOverShown=true;
    this.canReplay=false;
    c.removeAll(true);
    c.add(this.add.rectangle(W/2,H/2,W,H,0x0a0e14,.92));

    c.add(this.add.text(W/2,H*.1,'GAME OVER',
      {fontFamily:'Inter',fontSize:Math.max(22,TS*1.1)+'px',fontStyle:'700',color:'#e8a35c'}).setOrigin(.5));
    c.add(this.add.text(W/2,H*.2,'Score  '+this.score,
      {fontFamily:'Inter',fontSize:Math.max(18,TS*.75)+'px',fontStyle:'600',color:'#fff'}).setOrigin(.5));

    if(playerName){
      c.add(this.add.text(W/2,H*.28,`${playerName} · best ${Math.max(globalHigh,this.score)}`,
        {fontFamily:'Inter',fontSize:Math.max(11,TS*.34)+'px',color:'#7a8590'}).setOrigin(.5));
    }

    c.add(this.add.text(W/2,H*.36,'TOP SCORES',
      {fontFamily:'Inter',fontSize:Math.max(14,TS*.45)+'px',fontStyle:'800',color:'#ffa64d',letterSpacing:2}).setOrigin(.5));

    const panelHeight = Math.max(H*.35, TS*4.5);
    const panelY = H*.42 + (panelHeight/2) - TS*0.4;
    const panelWidth = Math.min(W*.8, 400);
    c.add(this.add.rectangle(W/2, panelY, panelWidth, panelHeight, 0x141a22, 0.8).setStrokeStyle(2, 0x33414f, 1).setOrigin(0.5));

    if(leaderboardEntries.length){
      leaderboardEntries.forEach((e,i)=>{
        const padName = e.name.length > 12 ? e.name.substring(0,10)+'..' : e.name.padEnd(12,' ');
        const entryText = `${i+1}.  ${padName}   ${e.score.toString().padStart(4,' ')}`;
        c.add(this.add.text(W/2,H*.42+i*TS*.6, entryText,
          {fontFamily:'monospace',fontSize:Math.max(13,TS*.45)+'px',color:i===0?'#ffa64d':'#cbd5e1', fontStyle:i===0?'700':'400'}
        ).setOrigin(.5));
      });
    } else {
      c.add(this.add.text(W/2,H*.48,'No scores yet',
        {fontFamily:'Inter',fontSize:Math.max(12,TS*.38)+'px',color:'#7a8590'}).setOrigin(.5));
    }

    const actionsY=Math.min(H*.42+Math.max(1,leaderboardEntries.length)*TS*.6+TS*1.5,H*.86);
    const buttonWidth=Math.min(220,Math.max(130,W*.3));
    const buttonHeight=Math.max(36,TS*.65);
    const buttonGap=Math.max(12,TS*.3);
    const buttonOffset=(buttonWidth+buttonGap)/2;
    const addActionButton=(x,label,fillColor,textColor,onActivate)=>{
      const bg=this.add.rectangle(x,actionsY,buttonWidth,buttonHeight,fillColor,1)
        .setStrokeStyle(2,label==='HOME'?0x66717d:0xffa64d,1)
        .setInteractive({useHandCursor:true});
      const labelText=this.add.text(x,actionsY,label,{
        fontFamily:'Inter',fontSize:Math.max(12,TS*.36)+'px',fontStyle:'700',color:textColor
      }).setOrigin(.5);
      bg.on('pointerover',()=>bg.setAlpha(.82));
      bg.on('pointerout',()=>bg.setAlpha(1));
      bg.on('pointerdown',pointer=>{
        pointer?.event?.stopPropagation?.();
        onActivate();
      });
      c.add([bg,labelText]);
      return bg;
    };

    this.playAgainButton=addActionButton(W/2-buttonOffset,'PLAY AGAIN',0xffa64d,'#111820',()=>this.replayIfReady());
    this.homeButton=addActionButton(W/2+buttonOffset,'HOME',0x1d2630,'#ffffff',()=>this.returnHomeIfReady());

    c.add(this.add.text(W/2,H*.96,'bioblitz.club/newts',
      {fontFamily:'Inter',fontSize:Math.max(10,TS*.28)+'px',color:'#5a8a4f'}).setOrigin(.5));

    c.setVisible(true).setAlpha(0);
    this.tweens.add({targets:c,alpha:1,duration:350,onComplete:()=>{this.canReplay=true;}});
  }

  /* ─────────────────────────────────────────────────────────
     UPDATE
     ───────────────────────────────────────────────────────── */
  update(time,delta){
    const W=this.scale.width, TS=this.TS, dt=delta/1000;
    if(this.isOver){
      this.updateCleaner(time,dt);
      return;
    }

    /* newt rotation */
    if(this.newtAlive&&this.newt){
      let ta=this.targetAng, ca=this.newt.angle, d=ta-ca;
      if(d>180) d-=360; if(d<-180) d+=360;
      this.newt.angle+=d*.22;
    }

    /* move vehicles with following behavior */
    const baseSpd=W*.085;
    const vehs=this.vehicles.children.getArray();
    vehs.forEach(v=>{ if(v&&v.active) v.spd=v.baseSpd; });
    vehs.forEach(v=>{
      if(!v||!v.active) return;
      /* desired center-to-center gap depends on both vehicles' widths */
      let minFollow=TS*2.6;
      let nearestDist=Infinity;
      const vWidth=TS*v.wm;
      const wrapW=W+vWidth*2;
      vehs.forEach(o=>{
        if(!o||!o.active||o===v) return;
        if(Math.abs(o.y-v.y)>TS*.6) return;
        let gap=v.dir>0?(o.x-v.x):(v.x-o.x);
        gap=((gap%wrapW)+wrapW)%wrapW;
        const desiredGap=(TS*v.wm+TS*o.wm)/2+TS*1.4;
        if(gap>0 && gap < desiredGap*1.6 && gap<nearestDist){
          nearestDist=gap;
          minFollow=desiredGap;
        }
      });
      if(nearestDist<minFollow){
        /* slow down (or stop) so the gap can open up again */
        v.spd=v.baseSpd*Math.max(0, nearestDist/minFollow);
      }
      v.anims.timeScale=v.spd*this.diff;
      v.x+=v.dir*baseSpd*v.spd*this.diff*dt;
      if (v.isTutorialCar) {
        const offScreen = (v.dir > 0 && v.x > W + vWidth) || (v.dir < 0 && v.x < -vWidth);
        const passed = v.dir * (v.x - this.newt.x) > v.displayWidth / 2 + TS * .5;
        if (this.isTutorial && this.tutorialStep === 3 && this.newtAlive &&
            (offScreen || passed || this.newt.y < v.y - TS)) {
          this.tutorialStep = 4;
          showTutorialStep(4);
        }
        if (offScreen) v.destroy();
      } else {
        if(v.dir>0&&v.x>W+vWidth) v.x=-vWidth;
        else if(v.dir<0&&v.x<-vWidth) v.x=W+vWidth;
      }
    });

    /* enforce a hard, non-overlapping gap between vehicles in the same lane */
    const byLane=new Map();
    vehs.forEach(v=>{
      if(!v||!v.active||v.isTutorialCar) return;
      const key=Math.round(v.y/TS);
      if(!byLane.has(key)) byLane.set(key,[]);
      byLane.get(key).push(v);
    });
    byLane.forEach(list=>{
      if(list.length<2) return;
      const dir=list[0].dir;
      /* sort in travel order: leaders first */
      list.sort((a,b)=> dir>0 ? b.x-a.x : a.x-b.x);
      for(let i=1;i<list.length;i++){
        const lead=list[i-1], follow=list[i];
        const desired=(TS*lead.wm+TS*follow.wm)/2+TS*1.4;
        if(dir>0){
          const limit=lead.x-desired;
          if(follow.x>limit) follow.x=limit;
        } else {
          const limit=lead.x+desired;
          if(follow.x<limit) follow.x=limit;
        }
      }
    });

    /* success check FIRST */
    if(this.newtAlive&&this.newt&&this.newt.y<this.ROAD_TOP-this.SHOULDER_H*.5){
      if (this.isTutorial) {
        this.onTutorialCross();
      } else {
        this.onCross();
      }
      return;
    }

    /* collision check */
    if(this.newtAlive&&this.newt&&!this.invulnerable){
      const nb=this.newt.getBounds();
      const m=TS*.2;
      const nR=new Phaser.Geom.Rectangle(nb.x+m,nb.y+m,nb.width-m*2,nb.height-m*2);
      let hit=false;
      this.vehicles.children.iterate(v=>{
        if(!v||!v.active||hit) return;
        if(Phaser.Geom.Rectangle.Overlaps(nR,v.getBounds())) hit=true;
      });
      if(hit) {
        if (this.isTutorial) {
          this.onTutorialHit();
        } else {
          this.onHit();
        }
      }
    }

    this.updateCleaner(time,dt);
  }
}

/* ═══════════════════════════════════════════════════════════════
   LAUNCH
   ═══════════════════════════════════════════════════════════════ */
function launchGame(){
  new Phaser.Game({
    type:Phaser.AUTO,
    parent:'game-wrapper',
    width:window.innerWidth,
    height:window.innerHeight,
    backgroundColor:'#0f1419',
    physics:{default:'arcade',arcade:{debug:false,gravity:{y:0}}},
    scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.CENTER_BOTH},
    scene:[GameScene],
    fps:{target:60,forceSetTimeOut:false},
    input:{activePointers:2}
  });
}
</script>
